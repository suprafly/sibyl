[project]
name = "sibyl"
version = "0.1.0"
description = "Faithful recovery of handwritten material into structured digital artifacts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sibyl = "sibyl.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
